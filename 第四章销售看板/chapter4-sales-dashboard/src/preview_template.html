<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四章 可视化看板</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10142e;color:#f2f2f2;font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}header,main,footer{max-width:1680px;margin:auto;padding:18px 24px}h1{margin:0 0 14px;font-size:25px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{display:flex;align-items:center;gap:9px}select,button{font:inherit;padding:7px 12px;border:1px solid #5b6791;border-radius:6px;background:#26315e;color:#fff;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #87d7ff;outline-offset:2px}.image{border:1px solid #35416a;border-radius:8px;overflow:hidden;background:#1a1e43}img{display:block;width:100%;height:auto}footer{padding-top:0;color:#bfc9e5;font-size:13px}@media(max-width:700px){header,main,footer{padding:12px}h1{font-size:21px}.controls{gap:8px}}</style></head>
<body><header><h1 id="title"></h1><div class="controls" id="controls"><button type="button" id="download">下载当前看板 PNG</button><button type="button" id="play" hidden aria-pressed="false">自动切换月份</button></div></header>
<main><div class="image"><img id="dashboard" alt="可视化看板"></div></main><footer id="note"></footer>
<script type="application/json" id="dashboard-data">DASHBOARD_DATA_JSON</script>
<script>
const data=JSON.parse(document.getElementById('dashboard-data').textContent),controls=document.getElementById('controls'),picture=document.getElementById('dashboard'),play=document.getElementById('play');
document.getElementById('title').textContent=data.title;document.getElementById('note').textContent=data.note;
const selects={};let timer=null,current=null;
for(const item of data.controls){const label=document.createElement('label');label.textContent=item.label;const select=document.createElement('select');select.setAttribute('aria-label',item.label);for(const value of item.options){const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option)}select.value=data.default[item.key];label.append(select);controls.insertBefore(label,document.getElementById('download'));selects[item.key]=select;select.addEventListener('change',update)}
function update(){const selected=Object.fromEntries(Object.entries(selects).map(([key,node])=>[key,node.value]));current=data.states.find(state=>Object.entries(selected).every(([key,value])=>state.config[key]===value));if(!current)return;picture.src=current.image;picture.alt=data.title+'：'+current.label}
document.getElementById('download').addEventListener('click',()=>{if(!current)return;const link=document.createElement('a');link.href=current.image;link.download='dashboard_'+Object.values(current.config).join('_')+'.png';link.click()});
if(selects.month){play.hidden=false;play.addEventListener('click',()=>{if(timer!==null){clearInterval(timer);timer=null;play.textContent='自动切换月份';play.setAttribute('aria-pressed','false')}else{timer=setInterval(()=>{const node=selects.month;node.selectedIndex=(node.selectedIndex+1)%node.options.length;update()},1800);play.textContent='暂停';play.setAttribute('aria-pressed','true')}})}
update();
</script></body></html>
